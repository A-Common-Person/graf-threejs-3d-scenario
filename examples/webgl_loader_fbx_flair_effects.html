<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js webgl - FBX loader with effects</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader with Effects<br />
		Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
	</div>

	<script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

	<script type="module">

		import * as THREE from 'three';
		import Stats from 'three/addons/libs/stats.module.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
		import { Audio, AudioListener, AudioLoader } from 'three';

		const manager = new THREE.LoadingManager();
		let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
		let mixer;
		let snowParticles;

		const clock = new THREE.Clock();

		const params = {
			asset: 'Taunt'
		};

		const assets = [
			'Taunt',
			'morph_test'
		];

		// Variables para control de efectos
		let rainSpeed = 0.5;
		let windSpeed = 0;
		let fogDensity = 0.002;
		let fogColor = new THREE.Color(0xffffff);

		init();

		function init() {
			const container = document.createElement('div');
			document.body.appendChild(container);

			camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
			camera.position.set(100, 200, 300);

			scene = new THREE.Scene();
			scene.background = new THREE.Color(0xa0a0a0);
			scene.fog = new THREE.FogExp2(fogColor, fogDensity); // Neblina

			const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 5);
			hemiLight.position.set(0, 200, 0);
			scene.add(hemiLight);

			const dirLight = new THREE.DirectionalLight(0xffffff, 5);
			dirLight.position.set(0, 200, 100);
			dirLight.castShadow = true;
			dirLight.shadow.camera.top = 180;
			dirLight.shadow.camera.bottom = -100;
			dirLight.shadow.camera.left = -120;
			dirLight.shadow.camera.right = 120;
			scene.add(dirLight);

			const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false }));
			mesh.rotation.x = - Math.PI / 2;
			mesh.receiveShadow = true;
			scene.add(mesh);

			const grid = new THREE.GridHelper(2000, 20, 0x000000, 0x000000);
			grid.material.opacity = 0.2;
			grid.material.transparent = true;
			scene.add(grid);

			// Lluvia de partículas (nieve)
			snowParticles = new THREE.Group();
			const snowGeometry = new THREE.SphereGeometry(1.8, 4, 4);
			const snowMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

			for (let i = 0; i < 500; i++) {
				const snowflake = new THREE.Mesh(snowGeometry, snowMaterial);
				snowflake.position.set(
					Math.random() * 1000 - 500,
					Math.random() * 500,
					Math.random() * 1000 - 500
				);
				snowParticles.add(snowflake);
			}
			scene.add(snowParticles);

			loader = new FBXLoader(manager);
			loadAsset(params.asset);

			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.shadowMap.enabled = true;
			container.appendChild(renderer.domElement);

			const controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 100, 0);
			controls.update();

			window.addEventListener('resize', onWindowResize);

			stats = new Stats();
			container.appendChild(stats.dom);

			const gui = new GUI();
			gui.add(params, 'asset', assets).onChange(function (value) {
				loadAsset(value);
			});

			guiMorphsFolder = gui.addFolder('Morphs').hide();

			const rgbeLoader = new RGBELoader();
			rgbeLoader.load('models/rgbe/studio_small_03_4k.hdr', function (texture) {
				texture.mapping = THREE.EquirectangularReflectionMapping;
				scene.background = texture;
				scene.environment = texture;
			});

			const listener = new AudioListener();
			camera.add(listener);

			const sound = new Audio(listener);
			const audioLoader = new AudioLoader();
			audioLoader.load('models/rgbe/MVGIRLSDAY.mp3', function (buffer) {
				sound.setBuffer(buffer);
				sound.setLoop(true);
				sound.setVolume(0.5);
				sound.play();
			});

			// Capturar teclas
			window.addEventListener('keydown', (event) => {
				switch (event.key.toLowerCase()) {
					case 'arrowup':
						rainSpeed += 0.1;
						break;
					case 'arrowdown':
						rainSpeed = Math.max(0, rainSpeed - 0.1);
						break;
					case 'r':
						snowParticles.children.forEach(p => p.material.color.set(0xff0000));
						break;
					case 'g':
						snowParticles.children.forEach(p => p.material.color.set(0x00ff00));
						break;
					case 'b':
						snowParticles.children.forEach(p => p.material.color.set(0x0000ff));
						break;
					case 'w':
						snowParticles.children.forEach(p => p.material.color.set(0xffffff));
						break;
					case 'v':
						windSpeed += 0.5;
						break;
					case 'arrowleft':
						fogDensity = Math.max(0, fogDensity - 0.0005);
						scene.fog.density = fogDensity;
						break;
					case 'arrowright':
						fogDensity += 0.0005;
						scene.fog.density = fogDensity;
						break;
					case 'a':
						fogColor.set(0xff0000);
						scene.fog.color = fogColor;
						break;
					case 's':
						fogColor.set(0x00ff00);
						scene.fog.color = fogColor;
						break;
					case 'd':
						fogColor.set(0x0000ff);
						scene.fog.color = fogColor;
						break;
					case 'f':
						fogColor.set(0xffffff);
						scene.fog.color = fogColor;
						break;
				}
			});
		}

		function loadAsset(asset) {
			loader.load('models/fbx/' + asset + '.fbx', function (group) {
				if (object) {
					object.traverse(function (child) {
						if (child.material) {
							const materials = Array.isArray(child.material) ? child.material : [child.material];
							materials.forEach(material => {
								if (material.map) material.map.dispose();
								material.dispose();
							});
						}
						if (child.geometry) child.geometry.dispose();
					});
					scene.remove(object);
				}

				object = group;

				if (object.animations && object.animations.length) {
					mixer = new THREE.AnimationMixer(object);
					const action = mixer.clipAction(object.animations[0]);
					action.play();
				} else {
					mixer = null;
				}

				guiMorphsFolder.children.forEach((child) => child.destroy());
				guiMorphsFolder.hide();

				object.traverse(function (child) {
					if (child.isMesh) {
						child.material = new THREE.MeshStandardMaterial({
							color: 0xaa9930,
							transparent: false,
							opacity: 0.9,
							roughness: 0.0,
							metalness: 1.7
						});

						child.castShadow = true;
						child.receiveShadow = true;

						if (child.morphTargetDictionary) {
							guiMorphsFolder.show();
							const meshFolder = guiMorphsFolder.addFolder(child.name || child.uuid);
							Object.keys(child.morphTargetDictionary).forEach((key) => {
								meshFolder.add(child.morphTargetInfluences, child.morphTargetDictionary[key], 0, 1, 0.01);
							});
						}
					}
				});

				scene.add(object);
			});
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function animate() {
			const delta = clock.getDelta();
			if (mixer) mixer.update(delta);

			snowParticles.children.forEach(p => {
				p.position.y -= rainSpeed;
				p.position.x += windSpeed;
				if (p.position.y < 0) {
					p.position.y = 500;
					p.position.x = Math.random() * 1000 - 500;
				}
			});

			renderer.render(scene, camera);
			stats.update();
		}

	</script>

</body>

</html>
